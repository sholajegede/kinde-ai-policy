<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- inputs -->
  <g>
    <rect x="40" y="70" width="230" height="96" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="155" y="108" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">Kinde access token</text>
    <text x="155" y="134" text-anchor="middle" font-size="14" fill="#4b5563">user or M2M agent, org_code,</text>
    <text x="155" y="153" text-anchor="middle" font-size="14" fill="#4b5563">roles, permissions, flags</text>

    <rect x="40" y="200" width="230" height="96" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="155" y="238" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">Your policy (JSON)</text>
    <text x="155" y="264" text-anchor="middle" font-size="14" fill="#4b5563">plans, grants, agent caps,</text>
    <text x="155" y="283" text-anchor="middle" font-size="14" fill="#4b5563">budgets per org, user, agent</text>
  </g>

  <!-- decide -->
  <rect x="330" y="50" width="300" height="266" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#312e81">decide()</text>
  <g font-size="15" fill="#1f2937">
    <text x="356" y="124">1. Verify the token (JWKS)</text>
    <text x="356" y="154">2. Pick the plan</text>
    <text x="356" y="184">3. Apply grants and agent caps</text>
    <text x="356" y="214">4. Choose model and fallbacks</text>
    <text x="356" y="244">5. Cap max output tokens</text>
    <text x="356" y="274">6. Check every budget</text>
  </g>
  <text x="480" y="302" text-anchor="middle" font-size="13" fill="#6b7280">allowed, or denied with a reason</text>

  <line x1="270" y1="118" x2="326" y2="150" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <line x1="270" y1="248" x2="326" y2="216" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <!-- prepare -->
  <rect x="690" y="50" width="230" height="130" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="805" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#064e3b">prepare()</text>
  <text x="805" y="118" text-anchor="middle" font-size="14" fill="#1f2937">reserve the worst-case cost</text>
  <text x="805" y="140" text-anchor="middle" font-size="14" fill="#1f2937">on every budget at once,</text>
  <text x="805" y="162" text-anchor="middle" font-size="14" fill="#1f2937">then render the request</text>
  <line x1="630" y1="115" x2="686" y2="115" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <!-- store -->
  <rect x="690" y="250" width="230" height="86" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="805" y="286" text-anchor="middle" font-size="18" font-weight="600" fill="#78350f">Budget store</text>
  <text x="805" y="312" text-anchor="middle" font-size="14" fill="#1f2937">spent and reserved, per period</text>
  <line x1="790" y1="180" x2="790" y2="246" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <!-- adapter -->
  <rect x="980" y="50" width="190" height="130" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="1075" y="88" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">Gateway adapter</text>
  <text x="1075" y="118" text-anchor="middle" font-size="14" fill="#4b5563">model, fallbacks,</text>
  <text x="1075" y="140" text-anchor="middle" font-size="14" fill="#4b5563">max tokens, user,</text>
  <text x="1075" y="162" text-anchor="middle" font-size="14" fill="#4b5563">in its native fields</text>
  <line x1="920" y1="115" x2="976" y2="115" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <!-- gateway -->
  <rect x="980" y="420" width="190" height="110" rx="14" fill="#111827"/>
  <text x="1075" y="462" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Your AI gateway</text>
  <text x="1075" y="488" text-anchor="middle" font-size="14" fill="#d1d5db">or model provider,</text>
  <text x="1075" y="508" text-anchor="middle" font-size="14" fill="#d1d5db">called by your code</text>
  <line x1="1075" y1="180" x2="1075" y2="416" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <!-- settle -->
  <rect x="690" y="420" width="230" height="110" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="805" y="458" text-anchor="middle" font-size="20" font-weight="700" fill="#064e3b">settle()</text>
  <text x="805" y="488" text-anchor="middle" font-size="14" fill="#1f2937">charge the real tokens or the</text>
  <text x="805" y="508" text-anchor="middle" font-size="14" fill="#1f2937">gateway's cost, free the rest</text>
  <line x1="980" y1="475" x2="924" y2="475" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text x="952" y="465" text-anchor="middle" font-size="12" fill="#6b7280">usage</text>
  <line x1="820" y1="420" x2="820" y2="340" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <text x="40" y="420" font-size="16" font-weight="600" fill="#111827">The package decides. The gateway routes.</text>
  <text x="40" y="448" font-size="14" fill="#4b5563">kinde-ai-policy never sends the model call itself.</text>
  <text x="40" y="472" font-size="14" fill="#4b5563">It tells your gateway what this caller may do,</text>
  <text x="40" y="496" font-size="14" fill="#4b5563">and keeps count of what they spent.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
